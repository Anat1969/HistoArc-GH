name: כיול מ-OpenStreetMap

# Runs the calibration pipeline on GitHub's servers and commits measured θ to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/calibrate.py src/data/measured.json
      - name: Commit measured values
        run: |
          git config user.name "calibration-bot"
          git config user.email "calibration-bot@users.noreply.github.com"
          git add src/data/measured.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "כיול: ערכי θ נמדדים מ-OpenStreetMap"
          git push
